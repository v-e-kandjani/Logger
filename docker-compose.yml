services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: syslog-clickhouse
    # Database is strictly local; bound ONLY to 127.0.0.1 (loopback) to prevent external network access
    ports:
      - "127.0.0.1:${CLICKHOUSE_LOCAL_PORT:-9000}:9000"
      - "127.0.0.1:${CLICKHOUSE_HTTP_LOCAL_PORT:-8123}:8123"
    environment:
      - CLICKHOUSE_DB=${CLICKHOUSE_DATABASE:-syslog}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER:-default}", "--password", "${CLICKHOUSE_PASSWORD:-}", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: syslog-postgres
    # Database is strictly local; bound ONLY to 127.0.0.1 (loopback) to prevent external network access
    ports:
      - "127.0.0.1:${POSTGRES_LOCAL_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-syslog_manager}
      - POSTGRES_USER=${POSTGRES_USER:-syslog_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-syslog_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    command:
      - "postgres"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=16MB"
      - "-c"
      - "maintenance_work_mem=64MB"
      - "-c"
      - "effective_cache_size=768MB"
      - "-c"
      - "wal_buffers=16MB"
      - "-c"
      - "checkpoint_completion_target=0.9"
      - "-c"
      - "max_connections=200"
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-syslog_admin} -d ${POSTGRES_DB:-syslog_manager}"]
      interval: 5s
      timeout: 3s
      retries: 5

  syslog-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syslog-app
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    # Host networking allows the container to receive syslog UDP/TCP packets
    # directly from the host network interfaces (ens192) without docker-proxy SNAT rewriting source IPs.
    network_mode: host
    environment:
      - CLICKHOUSE_HOST=${CLICKHOUSE_HOST:-127.0.0.1}
      - CLICKHOUSE_PORT=${CLICKHOUSE_PORT:-9000}
      - CLICKHOUSE_DATABASE=${CLICKHOUSE_DATABASE:-syslog}
      - CLICKHOUSE_USER=${CLICKHOUSE_USER:-default}
      - CLICKHOUSE_PASSWORD=${CLICKHOUSE_PASSWORD:-}
      - POSTGRES_HOST=${POSTGRES_HOST:-127.0.0.1}
      - POSTGRES_PORT=${POSTGRES_PORT:-5432}
      - POSTGRES_DB=${POSTGRES_DB:-syslog_manager}
      - POSTGRES_USER=${POSTGRES_USER:-syslog_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-syslog_secret}
      - POSTGRES_SSLMODE=disable
      - SERVER_LISTEN_ADDR=0.0.0.0:${APP_PORT:-8080}
      - SYSLOG_UDP_LISTEN_ADDR=0.0.0.0:514,0.0.0.0:5514
      - SYSLOG_TCP_LISTEN_ADDR=0.0.0.0:514,0.0.0.0:5514
      - ARCHIVE_PATH=/opt/syslog-platform/archive
      - TIMESTAMP_PROVIDER=${TIMESTAMP_PROVIDER:-mock}
      - SEED_DEMO_DEVICES=${SEED_DEMO_DEVICES:-false}
    volumes:
      - syslog_archives:/opt/syslog-platform/archive
      - ./timestamp-client:/opt/syslog-platform/timestamp-client
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/system/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  clickhouse_data:
  postgres_data:
  syslog_archives:
