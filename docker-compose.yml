services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: syslog-clickhouse
    # Database is strictly internal; no external host ports published
    environment:
      - CLICKHOUSE_DB=syslog
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./migrations/clickhouse:/docker-entrypoint-initdb.d
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: syslog-postgres
    # Database is strictly internal; no external host ports published
    environment:
      - POSTGRES_DB=syslog_manager
      - POSTGRES_USER=syslog_admin
      - POSTGRES_PASSWORD=syslog_secret
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/postgres:/docker-entrypoint-initdb.d
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syslog_admin -d syslog_manager"]
      interval: 5s
      timeout: 3s
      retries: 5

  syslog-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: syslog-app
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"       # Web Dashboard & REST API
      - "5514:5514/udp"   # Syslog UDP Listener
      - "5514:5514/tcp"   # Syslog TCP Listener
      - "514:5514/udp"    # Standard Syslog UDP mapped to container
      - "514:5514/tcp"    # Standard Syslog TCP mapped to container
      - "6514:6514/tcp"   # Syslog TLS
    environment:
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_PORT=9000
      - CLICKHOUSE_DATABASE=syslog
      - CLICKHOUSE_USER=default
      - CLICKHOUSE_PASSWORD=
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=syslog_manager
      - POSTGRES_USER=syslog_admin
      - POSTGRES_PASSWORD=syslog_secret
      - POSTGRES_SSLMODE=disable
      - SERVER_LISTEN_ADDR=0.0.0.0:8080
      - ARCHIVE_PATH=/opt/syslog-platform/archive
      - TIMESTAMP_PROVIDER=mock
    volumes:
      - syslog_archives:/opt/syslog-platform/archive
      - ./timestamp-client:/opt/syslog-platform/timestamp-client
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8080/api/v1/system/health"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  clickhouse_data:
  postgres_data:
  syslog_archives:
