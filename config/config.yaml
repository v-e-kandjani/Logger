server:
  listen_addr: "0.0.0.0:8080"
  read_timeout: 60s
  write_timeout: 0s
  collector_node: "node-01"

syslog:
  accept_unknown_sources: true
  udp:
    enabled: true
    listen_addr: "0.0.0.0:514,0.0.0.0:5514"
  tcp:
    enabled: true
    listen_addr: "0.0.0.0:514,0.0.0.0:5514"
  tls:
    enabled: false
    listen_addr: "0.0.0.0:6514"
  workers: 16
  queue_capacity: 250000

clickhouse:
  host: "127.0.0.1"
  port: 9000
  database: "syslog"
  username: "default"
  password: ""
  batch_size: 1000
  flush_timeout: 500ms
  max_retries: 5

postgres:
  host: "127.0.0.1"
  port: 5432
  database: "syslog_manager"
  username: "syslog_admin"
  password: "syslog_secret"
  ssl_mode: "disable"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 15m

archive:
  enabled: true
  storage_path: "/tmp/syslog-archive"
  interval: "hourly"
  schedule_minutes: 5
  hash_algorithm: "SHA-256"

timestamp:
  enabled: true
  provider: "mock" # KamuSM ready
  java_binary: "/usr/bin/java"
  jar_path: "/opt/syslog-platform/timestamp-client/tss-client-console-3.1.33.jar"
  server_url: "http://tzd.kamusm.gov.tr"
  server_port: 80
  digest_type: "sha-256"
  timeout: 60s
